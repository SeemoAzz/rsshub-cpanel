name: Build RSSHub bundle

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - .github/workflows/build-rsshub.yml
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Clone RSSHub
        run: git clone --depth 1 https://github.com/DIYgod/RSSHub.git RSSHub

      - name: Install, build, prune
        working-directory: RSSHub
        run: |
          pnpm install
          pnpm build
          pnpm prune --prod

      - name: Create bundle
        run: tar -czf rsshub-bundle.tar.gz -C RSSHub dist node_modules package.json

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete rsshub-bundle --yes 2>/dev/null || true
          gh release create rsshub-bundle rsshub-bundle.tar.gz \
            --title "RSSHub prebuilt bundle" \
            --notes "Pre-built RSSHub dist and production node_modules for cPanel deployment."
